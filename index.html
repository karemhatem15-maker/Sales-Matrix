<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill / Will Playbook</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f6f5f1;
      color: #1c1917;
    }
    .serif-title {
      font-family: 'Playfair Display', Georgia, serif;
    }
    input[type=range] {
      accent-color: #1e3a8a;
    }
    .range-will input[type=range] {
      accent-color: #b45309;
    }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const CRITERIA = [
      { name: "Product Knowledge", category: "Skill", meaning: "Knowledge of products, features, specifications, and benefits." },
      { name: "Sales Technique", category: "Skill", meaning: "Ability to apply effective sales methods throughout the sales process." },
      { name: "Communication & Presentation", category: "Skill", meaning: "Ability to communicate clearly and present products professionally." },
      { name: "Objection Handling", category: "Skill", meaning: "Ability to understand, address, and overcome customer objections." },
      { name: "Negotiation", category: "Skill", meaning: "Ability to reach mutually beneficial agreements while protecting company interests." },
      { name: "Closing", category: "Skill", meaning: "Ability to confidently convert opportunities into sales." },
      { name: "Follow-up", category: "Skill", meaning: "Ability to consistently follow up with customers and opportunities." },
      { name: "CRM / Process Knowledge", category: "Skill", meaning: "Understanding and proper use of CRM systems and sales processes." },
      { name: "Quotation Accuracy", category: "Skill", meaning: "Ability to prepare accurate quotations with correct prices, products, and details." },
      { name: "Account & Relationship Management", category: "Skill", meaning: "Ability to maintain strong customer relationships and manage key accounts." },
      { name: "Leads generation", category: "Skill", meaning: "Ability to actively identify and create new sales opportunities." },
      { name: "Engagement", category: "Will", meaning: "Level of involvement, energy, and active participation in daily work." },
      { name: "Target Drive", category: "Will", meaning: "Motivation and determination to achieve or exceed sales targets." },
      { name: "Initiative", category: "Will", meaning: "Willingness to take action without waiting for instructions." },
      { name: "Ownership & Accountability", category: "Will", meaning: "Takes responsibility for actions, decisions, and outcomes." },
      { name: "Learning & Development", category: "Will", meaning: "Commitment to personal growth and coaching." },
      { name: "Commitment", category: "Will", meaning: "Dedication to company goals and values." },
      { name: "Persistence", category: "Will", meaning: "Ability to stay motivated and bounce back from setbacks." },
      { name: "Teamwork", category: "Will", meaning: "Willingness to collaborate and support team members." }
    ];

    const INITIAL_ROSTER = [
      {
        id: "1",
        name: "Yara",
        ratings: {
          "Product Knowledge": 5, "Sales Technique": 5, "Communication & Presentation": 1,
          "Objection Handling": 5, "Negotiation": 5, "Closing": 5, "Follow-up": 5,
          "CRM / Process Knowledge": 3, "Quotation Accuracy": 3, "Account & Relationship Management": 3,
          "Leads generation": 3, "Engagement": 1, "Target Drive": 1, "Initiative": 2,
          "Ownership & Accountability": 5, "Learning & Development": 2, "Commitment": 5,
          "Persistence": 1, "Teamwork": 4
        }
      },
      {
        id: "2",
        name: "Mohamed Hassan",
        ratings: {
          "Product Knowledge": 3, "Sales Technique": 3, "Communication & Presentation": 4,
          "Objection Handling": 3, "Negotiation": 3, "Closing": 3, "Follow-up": 3,
          "CRM / Process Knowledge": 4, "Quotation Accuracy": 4, "Account & Relationship Management": 3,
          "Leads generation": 3, "Engagement": 2, "Target Drive": 2, "Initiative": 3,
          "Ownership & Accountability": 2, "Learning & Development": 3, "Commitment": 2,
          "Persistence": 2, "Teamwork": 2
        }
      },
      {
        id: "3",
        name: "Mohamed Elsawy",
        ratings: {
          "Product Knowledge": 3, "Sales Technique": 4, "Communication & Presentation": 4,
          "Objection Handling": 3, "Negotiation": 3, "Closing": 4, "Follow-up": 4,
          "CRM / Process Knowledge": 4, "Quotation Accuracy": 3, "Account & Relationship Management": 4,
          "Leads generation": 3, "Engagement": 4, "Target Drive": 4, "Initiative": 4,
          "Ownership & Accountability": 4, "Learning & Development": 4, "Commitment": 4,
          "Persistence": 4, "Teamwork": 3
        }
      },
      {
        id: "4",
        name: "Ahmed Hamdy",
        ratings: {
          "Product Knowledge": 2, "Sales Technique": 3, "Communication & Presentation": 2,
          "Objection Handling": 2, "Negotiation": 3, "Closing": 2, "Follow-up": 3,
          "CRM / Process Knowledge": 2, "Quotation Accuracy": 3, "Account & Relationship Management": 3,
          "Leads generation": 2, "Engagement": 3, "Target Drive": 2, "Initiative": 2,
          "Ownership & Accountability": 3, "Learning & Development": 2, "Commitment": 3,
          "Persistence": 3, "Teamwork": 3
        }
      }
    ];

    function App() {
      const [roster, setRoster] = useState(INITIAL_ROSTER);
      const [activeId, setActiveId] = useState("1");
      const [newEmpName, setNewEmpName] = useState("");
      
      const [editingId, setEditingId] = useState(null);
      const [editingName, setEditingName] = useState("");

      const activeEmployee = roster.find(e => e.id === activeId) || roster[0] || { name: "", ratings: {} };

      const handleRatingChange = (critName, val) => {
        setRoster(prev => prev.map(emp => {
          if (emp.id !== activeEmployee.id) return emp;
          return {
            ...emp,
            ratings: { ...emp.ratings, [critName]: Number(val) }
          };
        }));
      };

      const addEmployee = () => {
        if (!newEmpName.trim()) return;
        const newEmp = {
          id: Date.now().toString(),
          name: newEmpName.trim(),
          ratings: CRITERIA.reduce((acc, c) => ({ ...acc, [c.name]: 3 }), {})
        };
        setRoster([...roster, newEmp]);
        setActiveId(newEmp.id);
        setNewEmpName("");
      };

      const deleteEmployee = (id, e) => {
        e.stopPropagation();
        if (roster.length <= 1) {
          alert("At least one employee must remain in the roster.");
          return;
        }
        const updated = roster.filter(emp => emp.id !== id);
        setRoster(updated);
        if (activeId === id) {
          setActiveId(updated[0].id);
        }
      };

      const startEdit = (emp, e) => {
        e.stopPropagation();
        setEditingId(emp.id);
        setEditingName(emp.name);
      };

      const saveEdit = (id, e) => {
        e.stopPropagation();
        if (editingName.trim()) {
          setRoster(prev => prev.map(emp => emp.id === id ? { ...emp, name: editingName.trim() } : emp));
        }
        setEditingId(null);
      };

      const skillCriteria = CRITERIA.filter(c => c.category === "Skill");
      const willCriteria = CRITERIA.filter(c => c.category === "Will");

      const skillAvg = useMemo(() => {
        if (!activeEmployee.ratings) return "0.00";
        const sum = skillCriteria.reduce((acc, c) => acc + (activeEmployee.ratings[c.name] || 3), 0);
        return (sum / skillCriteria.length).toFixed(2);
      }, [activeEmployee]);

      const willAvg = useMemo(() => {
        if (!activeEmployee.ratings) return "0.00";
        const sum = willCriteria.reduce((acc, c) => acc + (activeEmployee.ratings[c.name] || 3), 0);
        return (sum / willCriteria.length).toFixed(2);
      }, [activeEmployee]);

      const isHighSkill = parseFloat(skillAvg) >= 3.0;
      const isHighWill = parseFloat(willAvg) >= 3.0;

      let quadrant = { label: "", badgeBg: "", approach: "", action: "" };
      if (isHighSkill && isHighWill) {
        quadrant = {
          label: "STAR",
          badgeBg: "bg-emerald-700 text-white",
          approach: "Delegate and stretch. Empower with autonomy and larger leadership initiatives.",
          action: "Assign strategic accounts, involve in mentoring junior reps, give stretch goals."
        };
      } else if (isHighSkill && !isHighWill) {
        quadrant = {
          label: "MOTIVATE / RE-ENGAGE",
          badgeBg: "bg-[#b8621b] text-white",
          approach: "Understand the underlying motivation problem. Re-engage the employee. Discuss career goals openly. Set clear expectations and use short-term, measurable targets. Monitor engagement closely.",
          action: "Hold a 1:1 to diagnose the motivation gap. Set short-term measurable targets (30-60 days). Reconnect goals to incentives/career growth. Monitor engagement weekly."
        };
      } else if (!isHighSkill && isHighWill) {
        quadrant = {
          label: "DEVELOP / COACH",
          badgeBg: "bg-blue-700 text-white",
          approach: "Guide and build capability. Provide regular coaching and direct skill training.",
          action: "Provide structured product/sales training, shadow on client calls, review technical proposals before submission."
        };
      } else {
        quadrant = {
          label: "PERFORMANCE MANAGEMENT",
          badgeBg: "bg-rose-700 text-white",
          approach: "Direct supervision and clear accountability. Focus on core execution.",
          action: "Set clear 30-day performance expectations with specific milestones. Schedule weekly check-ins to monitor daily activities."
        };
      }

      const sortedRatings = activeEmployee.ratings ? [...CRITERIA].map(c => ({
        ...c,
        val: activeEmployee.ratings[c.name] || 3
      })).sort((a, b) => b.val - a.val) : [];

      const strengths = sortedRatings.filter(r => r.val >= 4);
      const developments = [...sortedRatings].reverse().filter(r => r.val <= 2);

      return (
        <div className="max-w-5xl mx-auto space-y-7">
          
          {/* Header With Company Logo */}
          <div className="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-stone-300/80 pb-4">
            <div className="flex items-center gap-4">
              <img 
                src="logo.png" 
                alt="Logo" 
                className="h-12 w-auto object-contain rounded-md"
                onError={(e) => { e.target.style.display = 'none'; }}
              />
              <h1 className="serif-title text-3xl sm:text-4xl text-stone-900 tracking-tight">Skill / Will Playbook</h1>
            </div>
            <p className="text-xs text-stone-500 max-w-sm sm:text-right">
              Move a rating and watch the quadrant, matrix, and coaching plan update as you go.
            </p>
          </div>

          {/* Currently reviewing card */}
          <div className="bg-white/90 rounded-2xl p-6 sm:p-8 border border-stone-200/80 shadow-sm space-y-6">
            <div className="flex justify-between items-start">
              <div>
                <span className="text-xs font-semibold text-stone-400 tracking-wider">Currently reviewing</span>
                <h2 className="serif-title text-3xl font-bold text-stone-900 mt-1">{activeEmployee.name}</h2>
              </div>
              <div className="text-right">
                <span className="text-xs font-semibold text-stone-400 tracking-wider block mb-1">Resulting quadrant</span>
                <span className={`inline-block px-5 py-2.5 rounded-lg font-bold text-sm tracking-wide shadow-sm ${quadrant.badgeBg}`}>
                  {quadrant.label}
                </span>
              </div>
            </div>

            {/* Averages Sliders Preview */}
            <div className="space-y-4 pt-2">
              <div className="bg-[#f0ede6] p-5 rounded-xl border border-stone-200/60">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-xs font-semibold text-stone-600">Skill Average</span>
                  <span className={`text-xs px-3 py-0.5 rounded-full font-bold ${isHighSkill ? 'bg-emerald-700 text-white' : 'bg-rose-700 text-white'}`}>
                    {isHighSkill ? 'High' : 'Low'}
                  </span>
                </div>
                <div className="flex items-baseline gap-1">
                  <span className="text-3xl font-bold text-stone-900">{skillAvg}</span>
                  <span className="text-sm text-stone-500">/ 5.0</span>
                </div>
                <div className="mt-3 relative">
                  <div className="h-2 bg-stone-300/80 rounded-full overflow-hidden">
                    <div className="h-full bg-[#1e3a8a] rounded-full" style={{ width: `${(parseFloat(skillAvg) / 5) * 100}%` }}></div>
                  </div>
                  <div className="flex justify-between text-[11px] text-stone-500 mt-1">
                    <span>Low</span>
                    <span>Cutoff 3.0</span>
                    <span>High</span>
                  </div>
                </div>
              </div>

              <div className="bg-[#f0ede6] p-5 rounded-xl border border-stone-200/60">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-xs font-semibold text-stone-600">Will Average</span>
                  <span className={`text-xs px-3 py-0.5 rounded-full font-bold ${isHighWill ? 'bg-emerald-700 text-white' : 'bg-[#b8621b] text-white'}`}>
                    {isHighWill ? 'High' : 'Low'}
                  </span>
                </div>
                <div className="flex items-baseline gap-1">
                  <span className="text-3xl font-bold text-stone-900">{willAvg}</span>
                  <span className="text-sm text-stone-500">/ 5.0</span>
                </div>
                <div className="mt-3 relative">
                  <div className="h-2 bg-stone-300/80 rounded-full overflow-hidden">
                    <div className="h-full bg-[#b8621b] rounded-full" style={{ width: `${(parseFloat(willAvg) / 5) * 100}%` }}></div>
                  </div>
                  <div className="flex justify-between text-[11px] text-stone-500 mt-1">
                    <span>Low</span>
                    <span>Cutoff 3.0</span>
                    <span>High</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Roster Selection with Edit & Delete */}
          <div className="bg-white/90 rounded-2xl p-6 border border-stone-200/80 shadow-sm">
            <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-3">Roster</span>
            <div className="space-y-1.5">
              {roster.map(emp => {
                const sAvg = (CRITERIA.filter(c => c.category === "Skill").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 11);
                const wAvg = (CRITERIA.filter(c => c.category === "Will").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 8);
                const isH_S = sAvg >= 3.0;
                const isH_W = wAvg >= 3.0;
                let dot = "bg-rose-600";
                if (isH_S && isH_W) dot = "bg-emerald-600";
                else if (isH_S && !isH_W) dot = "bg-amber-600";
                else if (!isH_S && isH_W) dot = "bg-blue-600";

                const isSelected = emp.id === activeEmployee.id;

                return (
                  <div
                    key={emp.id}
                    onClick={() => setActiveId(emp.id)}
                    className={`w-full flex items-center justify-between px-4 py-2.5 rounded-lg cursor-pointer transition ${isSelected ? 'bg-[#f0ede6] font-semibold text-stone-900 shadow-sm' : 'hover:bg-stone-100 text-stone-700'}`}
                  >
                    <div className="flex items-center gap-3 flex-1 mr-2">
                      <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${dot}`}></span>
                      {editingId === emp.id ? (
                        <div className="flex items-center gap-2 flex-1" onClick={e => e.stopPropagation()}>
                          <input
                            type="text"
                            value={editingName}
                            onChange={e => setEditingName(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && saveEdit(emp.id, e)}
                            className="bg-white border border-stone-400 px-2 py-0.5 rounded text-sm w-full max-w-xs focus:outline-none"
                            autoFocus
                          />
                          <button
                            onClick={e => saveEdit(emp.id, e)}
                            className="text-xs bg-emerald-700 text-white px-2.5 py-1 rounded hover:bg-emerald-800"
                          >
                            Save
                          </button>
                        </div>
                      ) : (
                        <span>{emp.name}</span>
                      )}
                    </div>

                    {editingId !== emp.id && (
                      <div className="flex items-center gap-2">
                        <button
                          title="Rename Employee"
                          onClick={e => startEdit(emp, e)}
                          className="text-stone-400 hover:text-stone-700 p-1 transition"
                        >
                          ✏️
                        </button>
                        <button
                          title="Delete Employee"
                          onClick={e => deleteEmployee(emp.id, e)}
                          className="text-stone-400 hover:text-rose-600 p-1 transition"
                        >
                          🗑️
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="mt-4 pt-3 border-t border-stone-200 flex gap-2">
              <input
                type="text"
                placeholder="+ Add employee"
                value={newEmpName}
                onChange={e => setNewEmpName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addEmployee()}
                className="bg-[#f0ede6] border border-stone-300 px-3 py-2 rounded-lg text-sm flex-1 focus:outline-none focus:ring-1 focus:ring-stone-400"
              />
              <button
                onClick={addEmployee}
                className="bg-stone-800 text-white text-xs px-4 py-2 rounded-lg font-semibold hover:bg-stone-900 transition"
              >
                Add
              </button>
            </div>
          </div>

          <div className="bg-white/90 rounded-2xl p-5 border border-stone-200/80 shadow-sm">
            <span className="text-xs font-semibold text-stone-500 uppercase tracking-wider block mb-1">Quadrant rule</span>
            <p className="text-xs text-stone-600">
              Skill or Will ≥ 3.0 counts as High — locked to the original workbook's formula.
            </p>
          </div>

          <div className="bg-white/90 rounded-2xl p-6 sm:p-8 border border-stone-200/80 shadow-sm">
            <div className="flex items-center gap-2 mb-6">
              <span className="w-2.5 h-2.5 rounded-full bg-[#1e3a8a]"></span>
              <h3 className="serif-title text-xl font-bold text-stone-900">Skill</h3>
              <span className="text-xs text-stone-500 font-sans">11 criteria</span>
            </div>
            <div className="space-y-6">
              {skillCriteria.map(crit => {
                const val = activeEmployee.ratings ? (activeEmployee.ratings[crit.name] || 3) : 3;
                return (
                  <div key={crit.name} className="space-y-1.5">
                    <div className="flex justify-between items-baseline">
                      <span className="text-sm font-medium text-stone-800">{crit.name}</span>
                      <span className="text-sm font-bold text-[#1e3a8a]">{val}</span>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="5"
                      step="1"
                      value={val}
                      onChange={e => handleRatingChange(crit.name, e.target.value)}
                      className="w-full h-1.5 bg-stone-200 rounded-lg appearance-none cursor-pointer"
                    />
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white/90 rounded-2xl p-6 sm:p-8 border border-stone-200/80 shadow-sm range-will">
            <div className="flex items-center gap-2 mb-6">
              <span className="w-2.5 h-2.5 rounded-full bg-[#b8621b]"></span>
              <h3 className="serif-title text-xl font-bold text-stone-900">Will</h3>
              <span className="text-xs text-stone-500 font-sans">8 criteria</span>
            </div>
            <div className="space-y-6">
              {willCriteria.map(crit => {
                const val = activeEmployee.ratings ? (activeEmployee.ratings[crit.name] || 3) : 3;
                return (
                  <div key={crit.name} className="space-y-1.5">
                    <div className="flex justify-between items-baseline">
                      <span className="text-sm font-medium text-stone-800">{crit.name}</span>
                      <span className="text-sm font-bold text-[#b8621b]">{val}</span>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="5"
                      step="1"
                      value={val}
                      onChange={e => handleRatingChange(crit.name, e.target.value)}
                      className="w-full h-1.5 bg-stone-200 rounded-lg appearance-none cursor-pointer"
                    />
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white/90 rounded-2xl p-6 sm:p-8 border border-stone-200/80 shadow-sm">
            <h4 className="serif-title text-xl font-bold text-stone-900 mb-4 flex items-center gap-2">
              <span className="text-emerald-700">☆</span> Top strengths
            </h4>
            <div className="space-y-3">
              {strengths.length > 0 ? strengths.map(s => (
                <div key={s.name} className="flex justify-between items-center border-b border-stone-100 pb-2.5">
                  <span className="text-sm text-stone-800">{s.name}</span>
                  <span className="text-sm font-bold text-emerald-700">{s.val}/5</span>
                </div>
              )) : <p className="text-xs text-stone-400">No criteria rated 4 or 5.</p>}
            </div>
          </div>

          <div className="bg-white/90 rounded-2xl p-6 sm:p-8 border border-stone-200/80 shadow-sm">
            <h4 className="serif-title text-xl font-bold text-stone-900 mb-4 flex items-center gap-2">
              <span className="text-rose-700">◎</span> Development areas
            </h4>
            <div className="space-y-4">
              {developments.length > 0 ? developments.map(d => (
                <div key={d.name} className="border-b border-stone-100 pb-3">
                  <div className="flex justify-between items-baseline">
                    <span className="text-sm font-semibold text-stone-900">{d.name}</span>
                    <span className="text-sm font-bold text-rose-700">{d.val}/5</span>
                  </div>
                  <p className="text-xs text-stone-500 mt-1">{d.meaning}</p>
                </div>
              )) : <p className="text-xs text-stone-400">No criteria rated 1 or 2.</p>}
            </div>
          </div>

          <div className="bg-[#272138] text-stone-100 rounded-2xl p-6 sm:p-8 shadow-md space-y-5">
            <h4 className="serif-title text-2xl font-bold flex items-center gap-2">
              <span>✦</span> Coaching plan
            </h4>
            <div>
              <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-1">
                Recommended management approach
              </span>
              <p className="text-sm text-stone-200 leading-relaxed">{quadrant.approach}</p>
            </div>
            <div>
              <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-1">
                Development / coaching action
              </span>
              <p className="text-sm text-stone-200 leading-relaxed">{quadrant.action}</p>
            </div>
          </div>

          <div className="bg-white/90 rounded-2xl p-6 sm:p-8 border border-stone-200/80 shadow-sm">
            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-6">
              <h3 className="serif-title text-2xl font-bold text-stone-900">Team Skill / Will Matrix</h3>
              <div className="flex flex-wrap gap-4 text-xs font-semibold text-stone-600">
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-600"></span> STAR</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#b8621b]"></span> MOTIVATE / RE-ENGAGE</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span> DEVELOP / COACH</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-rose-600"></span> PERFORMANCE MANAGEMENT</span>
              </div>
            </div>

            <div className="relative w-full aspect-[16/10] bg-white border border-stone-300 rounded-xl overflow-hidden p-6 shadow-inner">
              <div className="absolute left-1/2 top-0 bottom-0 w-px border-r border-dashed border-stone-300"></div>
              <div className="absolute top-1/2 left-0 right-0 h-px border-b border-dashed border-stone-300"></div>

              <span className="absolute top-3 left-4 text-[10px] font-semibold text-blue-800/30 uppercase tracking-wider">Develop / Coach</span>
              <span className="absolute top-3 right-4 text-[10px] font-semibold text-emerald-800/30 uppercase tracking-wider text-right">Star</span>
              <span className="absolute bottom-3 left-4 text-[10px] font-semibold text-rose-800/30 uppercase tracking-wider">Performance Management</span>
              <span className="absolute bottom-3 right-4 text-[10px] font-semibold text-amber-800/30 uppercase tracking-wider text-right">Motivate / Re-Engage</span>

              {roster.map(emp => {
                const sAvg = (CRITERIA.filter(c => c.category === "Skill").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 11);
                const wAvg = (CRITERIA.filter(c => c.category === "Will").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 8);

                const left = ((sAvg - 1) / 4) * 82 + 9;
                const bottom = ((wAvg - 1) / 4) * 82 + 9;

                const isH_S = sAvg >= 3.0;
                const isH_W = wAvg >= 3.0;
                let dotColor = "#be123c";
                if (isH_S && isH_W) dotColor = "#059669";
                else if (isH_S && !isH_W) dotColor = "#b8621b";
                else if (!isH_S && isH_W) dotColor = "#1d4ed8";

                const isCurrent = emp.id === activeEmployee.id;

                return (
                  <div
                    key={emp.id}
                    onClick={() => setActiveId(emp.id)}
                    className="absolute cursor-pointer -translate-x-1/2 translate-y-1/2 flex flex-col items-center group transition z-10"
                    style={{ left: `${left}%`, bottom: `${bottom}%` }}
                  >
                    <div className="relative flex items-center justify-center">
                      {isCurrent && (
                        <span className="absolute w-8 h-8 rounded-full border-2 border-stone-700/60 animate-ping opacity-40"></span>
                      )}
                      <span
                        className={`rounded-full transition ${isCurrent ? 'w-4 h-4 ring-2 ring-stone-900 shadow-md scale-125' : 'w-3 h-3 hover:scale-125'}`}
                        style={{ backgroundColor: dotColor }}
                      ></span>
                    </div>
                    <span className={`text-[10px] mt-1 whitespace-nowrap px-1.5 py-0.5 rounded shadow-sm ${isCurrent ? 'font-bold text-stone-900 bg-[#f0ede6] border border-stone-300' : 'text-stone-600 bg-white/90 border border-stone-200'}`}>
                      {emp.name}
                    </span>
                  </div>
                );
              })}
            </div>

            <div className="flex justify-between text-xs text-stone-400 mt-3 font-mono">
              <span>Skill Average (1.0 → 5.0)</span>
              <span>Will Average (1.0 → 5.0)</span>
            </div>
          </div>

          <footer className="text-center text-xs text-stone-400 py-6">
            Prototype for UX review — quadrant split is locked at 3.0 on both axes, matching the original workbook.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
