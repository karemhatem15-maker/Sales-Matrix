<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Team Skill / Will Playbook</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f6f5f1;
      color: #1e293b;
    }
    .serif-title {
      font-family: 'Playfair Display', Georgia, serif;
    }
    input[type=range] {
      accent-color: #1e3a8a;
    }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const CRITERIA = [
      { name: "Product Knowledge", category: "Skill", meaning: "Knowledge of products, features, specifications, and benefits." },
      { name: "Sales Technique", category: "Skill", meaning: "Ability to apply effective sales methods throughout the sales process." },
      { name: "Communication & Presentation", category: "Skill", meaning: "Ability to communicate clearly and present products professionally." },
      { name: "Objection Handling", category: "Skill", meaning: "Ability to understand, address, and overcome customer objections." },
      { name: "Negotiation", category: "Skill", meaning: "Ability to reach mutually beneficial agreements while protecting company interests." },
      { name: "Closing", category: "Skill", meaning: "Ability to confidently convert opportunities into sales." },
      { name: "Follow-up", category: "Skill", meaning: "Ability to consistently follow up with customers and opportunities." },
      { name: "CRM / Process Knowledge", category: "Skill", meaning: "Understanding and proper use of CRM systems and sales processes." },
      { name: "Quotation Accuracy", category: "Skill", meaning: "Ability to prepare accurate quotations with correct prices and details." },
      { name: "Account & Relationship Management", category: "Skill", meaning: "Ability to maintain strong customer relationships." },
      { name: "Leads generation", category: "Skill", meaning: "Ability to actively identify and create new sales opportunities." },
      { name: "Engagement", category: "Will", meaning: "Level of involvement, energy, and active participation in daily work." },
      { name: "Target Drive", category: "Will", meaning: "Motivation and determination to achieve or exceed sales targets." },
      { name: "Initiative", category: "Will", meaning: "Willingness to take action without waiting for instructions." },
      { name: "Ownership & Accountability", category: "Will", meaning: "Takes responsibility for actions, decisions, and outcomes." },
      { name: "Learning & Development", category: "Will", meaning: "Commitment to personal growth and coaching." },
      { name: "Commitment", category: "Will", meaning: "Dedication to company goals and values." },
      { name: "Persistence", category: "Will", meaning: "Ability to stay motivated and bounce back from setbacks." },
      { name: "Teamwork", category: "Will", meaning: "Willingness to collaborate and support team members." }
    ];

    const INITIAL_ROSTER = [
      {
        id: "1",
        name: "Yara",
        ratings: {
          "Product Knowledge": 5, "Sales Technique": 5, "Communication & Presentation": 1,
          "Objection Handling": 5, "Negotiation": 5, "Closing": 5, "Follow-up": 5,
          "CRM / Process Knowledge": 3, "Quotation Accuracy": 3, "Account & Relationship Management": 3,
          "Leads generation": 3, "Engagement": 1, "Target Drive": 1, "Initiative": 2,
          "Ownership & Accountability": 5, "Learning & Development": 2, "Commitment": 5,
          "Persistence": 1, "Teamwork": 4
        }
      },
      {
        id: "2",
        name: "Mohamed Hassan",
        ratings: {
          "Product Knowledge": 3, "Sales Technique": 3, "Communication & Presentation": 4,
          "Objection Handling": 3, "Negotiation": 3, "Closing": 3, "Follow-up": 3,
          "CRM / Process Knowledge": 4, "Quotation Accuracy": 4, "Account & Relationship Management": 3,
          "Leads generation": 3, "Engagement": 2, "Target Drive": 2, "Initiative": 3,
          "Ownership & Accountability": 2, "Learning & Development": 3, "Commitment": 2,
          "Persistence": 2, "Teamwork": 2
        }
      },
      {
        id: "3",
        name: "Mohamed Elsawy",
        ratings: {
          "Product Knowledge": 3, "Sales Technique": 4, "Communication & Presentation": 4,
          "Objection Handling": 3, "Negotiation": 3, "Closing": 4, "Follow-up": 4,
          "CRM / Process Knowledge": 4, "Quotation Accuracy": 3, "Account & Relationship Management": 4,
          "Leads generation": 3, "Engagement": 4, "Target Drive": 4, "Initiative": 4,
          "Ownership & Accountability": 4, "Learning & Development": 4, "Commitment": 4,
          "Persistence": 4, "Teamwork": 3
        }
      },
      {
        id: "4",
        name: "Ahmed Hamdy",
        ratings: {
          "Product Knowledge": 2, "Sales Technique": 3, "Communication & Presentation": 2,
          "Objection Handling": 2, "Negotiation": 3, "Closing": 2, "Follow-up": 3,
          "CRM / Process Knowledge": 2, "Quotation Accuracy": 3, "Account & Relationship Management": 3,
          "Leads generation": 2, "Engagement": 3, "Target Drive": 2, "Initiative": 2,
          "Ownership & Accountability": 3, "Learning & Development": 2, "Commitment": 3,
          "Persistence": 3, "Teamwork": 3
        }
      }
    ];

    function App() {
      const [roster, setRoster] = useState(INITIAL_ROSTER);
      const [activeId, setActiveId] = useState("1");
      const [newEmpName, setNewEmpName] = useState("");

      const activeEmployee = roster.find(e => e.id === activeId) || roster[0];

      const handleRatingChange = (critName, val) => {
        setRoster(prev => prev.map(emp => {
          if (emp.id !== activeEmployee.id) return emp;
          return {
            ...emp,
            ratings: { ...emp.ratings, [critName]: Number(val) }
          };
        }));
      };

      const addEmployee = () => {
        if (!newEmpName.trim()) return;
        const newEmp = {
          id: Date.now().toString(),
          name: newEmpName.trim(),
          ratings: CRITERIA.reduce((acc, c) => ({ ...acc, [c.name]: 3 }), {})
        };
        setRoster([...roster, newEmp]);
        setActiveId(newEmp.id);
        setNewEmpName("");
      };

      const skillCriteria = CRITERIA.filter(c => c.category === "Skill");
      const willCriteria = CRITERIA.filter(c => c.category === "Will");

      const skillAvg = useMemo(() => {
        const sum = skillCriteria.reduce((acc, c) => acc + (activeEmployee.ratings[c.name] || 3), 0);
        return (sum / skillCriteria.length).toFixed(2);
      }, [activeEmployee]);

      const willAvg = useMemo(() => {
        const sum = willCriteria.reduce((acc, c) => acc + (activeEmployee.ratings[c.name] || 3), 0);
        return (sum / willCriteria.length).toFixed(2);
      }, [activeEmployee]);

      const isHighSkill = parseFloat(skillAvg) >= 3.0;
      const isHighWill = parseFloat(willAvg) >= 3.0;

      let quadrant = { label: "", badgeColor: "", bg: "", approach: "", action: "" };
      if (isHighSkill && isHighWill) {
        quadrant = {
          label: "STAR",
          badgeColor: "bg-emerald-700 text-white",
          dotColor: "bg-emerald-600",
          approach: "Delegate and stretch. Empower with autonomy and larger leadership initiatives.",
          action: "Assign strategic accounts, involve in mentoring junior reps, give stretch goals."
        };
      } else if (isHighSkill && !isHighWill) {
        quadrant = {
          label: "MOTIVATE / RE-ENGAGE",
          badgeColor: "bg-amber-600 text-white",
          dotColor: "bg-amber-600",
          approach: "Understand the underlying motivation problem. Re-engage the employee. Discuss career goals openly.",
          action: "Hold a 1:1 to diagnose the motivation gap. Set short-term measurable targets (30-60 days). Reconnect goals to incentives/career growth."
        };
      } else if (!isHighSkill && isHighWill) {
        quadrant = {
          label: "DEVELOP / COACH",
          badgeColor: "bg-blue-600 text-white",
          dotColor: "bg-blue-600",
          approach: "Guide and build capability. Provide regular coaching and direct skill training.",
          action: "Provide structured product/sales training, shadow on client calls, review technical proposals before submission."
        };
      } else {
        quadrant = {
          label: "PERFORMANCE MANAGEMENT",
          badgeColor: "bg-rose-700 text-white",
          dotColor: "bg-rose-600",
          approach: "Direct supervision and clear accountability. Focus on core execution.",
          action: "Set clear 30-day performance expectations with specific milestones. Schedule weekly check-ins to monitor daily activities."
        };
      }

      // Strengths & Growth
      const sortedRatings = [...CRITERIA].map(c => ({
        ...c,
        val: activeEmployee.ratings[c.name] || 3
      })).sort((a, b) => b.val - a.val);

      const strengths = sortedRatings.filter(r => r.val >= 4).slice(0, 3);
      const developments = [...sortedRatings].reverse().filter(r => r.val <= 2).slice(0, 4);

      return (
        <div className="max-w-5xl mx-auto space-y-8">
          
          {/* Header */}
          <div className="flex flex-col sm:flex-row justify-between items-baseline gap-2 border-b border-stone-300 pb-4">
            <h1 className="serif-title text-4xl text-stone-900 tracking-tight">Skill / Will Playbook</h1>
            <p className="text-xs text-stone-500 max-w-sm text-right hidden sm:block">
              Move a rating and watch the quadrant, matrix, and coaching plan update as you go.
            </p>
          </div>

          {/* Top Card: Currently Reviewing & Summary */}
          <div className="bg-stone-100 rounded-2xl p-6 sm:p-8 border border-stone-200 shadow-sm space-y-6">
            <div className="flex justify-between items-start">
              <div>
                <span className="text-xs font-semibold text-stone-400 tracking-wider uppercase">Currently reviewing</span>
                <h2 className="serif-title text-3xl font-bold text-stone-900 mt-1">{activeEmployee.name}</h2>
              </div>
              <div className="text-right">
                <span className="text-xs font-semibold text-stone-400 tracking-wider uppercase block mb-1">Resulting quadrant</span>
                <span className={`inline-block px-5 py-2 rounded-lg font-bold text-sm tracking-wide ${quadrant.badgeColor}`}>
                  {quadrant.label}
                </span>
              </div>
            </div>

            {/* Averages */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div className="bg-stone-200/70 p-5 rounded-xl">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-xs font-semibold text-stone-600">Skill Average</span>
                  <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${isHighSkill ? 'bg-emerald-700 text-white' : 'bg-rose-600 text-white'}`}>
                    {isHighSkill ? 'High' : 'Low'}
                  </span>
                </div>
                <div className="flex items-baseline gap-1">
                  <span className="text-3xl font-bold text-stone-900">{skillAvg}</span>
                  <span className="text-sm text-stone-500">/ 5.0</span>
                </div>
                <div className="mt-3 relative">
                  <div className="h-2 bg-stone-300 rounded-full overflow-hidden">
                    <div className="h-full bg-blue-900 rounded-full" style={{ width: `${(parseFloat(skillAvg) / 5) * 100}%` }}></div>
                  </div>
                  <div className="flex justify-between text-[10px] text-stone-400 mt-1">
                    <span>Low</span>
                    <span>Cutoff 3.0</span>
                    <span>High</span>
                  </div>
                </div>
              </div>

              <div className="bg-stone-200/70 p-5 rounded-xl">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-xs font-semibold text-stone-600">Will Average</span>
                  <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${isHighWill ? 'bg-emerald-700 text-white' : 'bg-amber-600 text-white'}`}>
                    {isHighWill ? 'High' : 'Low'}
                  </span>
                </div>
                <div className="flex items-baseline gap-1">
                  <span className="text-3xl font-bold text-stone-900">{willAvg}</span>
                  <span className="text-sm text-stone-500">/ 5.0</span>
                </div>
                <div className="mt-3 relative">
                  <div className="h-2 bg-stone-300 rounded-full overflow-hidden">
                    <div className="h-full bg-amber-600 rounded-full" style={{ width: `${(parseFloat(willAvg) / 5) * 100}%` }}></div>
                  </div>
                  <div className="flex justify-between text-[10px] text-stone-400 mt-1">
                    <span>Low</span>
                    <span>Cutoff 3.0</span>
                    <span>High</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Roster List Section */}
          <div className="bg-stone-100 rounded-2xl p-6 border border-stone-200 shadow-sm">
            <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-3">Roster</span>
            <div className="space-y-1">
              {roster.map(emp => {
                const sAvg = (CRITERIA.filter(c => c.category === "Skill").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 11);
                const wAvg = (CRITERIA.filter(c => c.category === "Will").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 8);
                const isH_S = sAvg >= 3.0;
                const isH_W = wAvg >= 3.0;
                let dot = "bg-rose-600";
                if (isH_S && isH_W) dot = "bg-emerald-600";
                else if (isH_S && !isH_W) dot = "bg-amber-600";
                else if (!isH_S && isH_W) dot = "bg-blue-600";

                const isSelected = emp.id === activeEmployee.id;

                return (
                  <button
                    key={emp.id}
                    onClick={() => setActiveId(emp.id)}
                    className={`w-full flex items-center justify-between px-4 py-2.5 rounded-lg text-left transition ${isSelected ? 'bg-stone-200 font-semibold text-stone-900 shadow-sm' : 'hover:bg-stone-200/50 text-stone-700'}`}
                  >
                    <div className="flex items-center gap-3">
                      <span className={`w-2.5 h-2.5 rounded-full ${dot}`}></span>
                      <span>{emp.name}</span>
                    </div>
                  </button>
                );
              })}
            </div>

            {/* Quick Add */}
            <div className="mt-4 pt-3 border-t border-stone-200 flex gap-2">
              <input
                type="text"
                placeholder="+ Add employee name..."
                value={newEmpName}
                onChange={e => setNewEmpName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addEmployee()}
                className="bg-white border border-stone-300 px-3 py-1.5 rounded-lg text-sm flex-1 focus:outline-none focus:ring-1 focus:ring-blue-900"
              />
              <button
                onClick={addEmployee}
                className="bg-stone-800 text-white text-xs px-4 py-1.5 rounded-lg font-semibold hover:bg-black transition"
              >
                Add
              </button>
            </div>
          </div>

          {/* Sliders Area */}
          <div className="space-y-6">
            <div className="text-xs text-stone-500 font-serif italic">
              Quadrant rule: Skill or Will ≥ 3.0 counts as High — locked to the original workbook's formula.
            </div>

            {/* Skill Sliders */}
            <div className="bg-stone-100 rounded-2xl p-6 sm:p-8 border border-stone-200 shadow-sm">
              <div className="flex items-center gap-2 mb-6">
                <span className="w-3 h-3 rounded-full bg-blue-900"></span>
                <h3 className="serif-title text-xl font-bold text-stone-900">Skill</h3>
                <span className="text-xs text-stone-500">11 criteria</span>
              </div>
              <div className="space-y-5">
                {skillCriteria.map(crit => {
                  const val = activeEmployee.ratings[crit.name] || 3;
                  return (
                    <div key={crit.name} className="space-y-1">
                      <div className="flex justify-between items-baseline">
                        <span className="text-sm font-medium text-stone-800">{crit.name}</span>
                        <span className="text-sm font-bold text-blue-900">{val}</span>
                      </div>
                      <input
                        type="range"
                        min="1"
                        max="5"
                        step="1"
                        value={val}
                        onChange={e => handleRatingChange(crit.name, e.target.value)}
                        className="w-full h-1.5 bg-stone-300 rounded-lg appearance-none cursor-pointer"
                      />
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Will Sliders */}
            <div className="bg-stone-100 rounded-2xl p-6 sm:p-8 border border-stone-200 shadow-sm">
              <div className="flex items-center gap-2 mb-6">
                <span className="w-3 h-3 rounded-full bg-amber-600"></span>
                <h3 className="serif-title text-xl font-bold text-stone-900">Will</h3>
                <span className="text-xs text-stone-500">8 criteria</span>
              </div>
              <div className="space-y-5">
                {willCriteria.map(crit => {
                  const val = activeEmployee.ratings[crit.name] || 3;
                  return (
                    <div key={crit.name} className="space-y-1">
                      <div className="flex justify-between items-baseline">
                        <span className="text-sm font-medium text-stone-800">{crit.name}</span>
                        <span className="text-sm font-bold text-amber-700">{val}</span>
                      </div>
                      <input
                        type="range"
                        min="1"
                        max="5"
                        step="1"
                        value={val}
                        onChange={e => handleRatingChange(crit.name, e.target.value)}
                        className="w-full h-1.5 bg-stone-300 rounded-lg appearance-none cursor-pointer"
                      />
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Top Strengths & Development Areas */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-stone-100 rounded-2xl p-6 border border-stone-200 shadow-sm">
              <h4 className="serif-title text-lg font-bold text-stone-900 mb-4 flex items-center gap-2">
                <span>☆</span> Top strengths
              </h4>
              <div className="space-y-3">
                {strengths.length > 0 ? strengths.map(s => (
                  <div key={s.name} className="flex justify-between border-b border-stone-200 pb-2">
                    <span className="text-sm text-stone-800">{s.name}</span>
                    <span className="text-sm font-bold text-emerald-700">{s.val}/5</span>
                  </div>
                )) : <p className="text-xs text-stone-400">No criteria rated 4 or 5 yet.</p>}
              </div>
            </div>

            <div className="bg-stone-100 rounded-2xl p-6 border border-stone-200 shadow-sm">
              <h4 className="serif-title text-lg font-bold text-stone-900 mb-4 flex items-center gap-2">
                <span>◎</span> Development areas
              </h4>
              <div className="space-y-3">
                {developments.length > 0 ? developments.map(d => (
                  <div key={d.name} className="flex justify-between border-b border-stone-200 pb-2">
                    <span className="text-sm text-stone-800">{d.name}</span>
                    <span className="text-sm font-bold text-rose-700">{d.val}/5</span>
                  </div>
                )) : <p className="text-xs text-stone-400">No criteria rated 1 or 2.</p>}
              </div>
            </div>
          </div>

          {/* Coaching Plan Card (Dark Navy Box) */}
          <div className="bg-[#242038] text-stone-100 rounded-2xl p-6 sm:p-8 shadow-md space-y-4">
            <h4 className="serif-title text-xl font-bold flex items-center gap-2">
              <span>✦</span> Coaching plan
            </h4>
            <div>
              <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-1">
                Recommended management approach
              </span>
              <p className="text-sm text-stone-200 leading-relaxed">{quadrant.approach}</p>
            </div>
            <div>
              <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-1">
                Development / coaching action
              </span>
              <p className="text-sm text-stone-200 leading-relaxed">{quadrant.action}</p>
            </div>
          </div>

          {/* Team Skill / Will Matrix Plot (SVG 2x2) */}
          <div className="bg-stone-100 rounded-2xl p-6 sm:p-8 border border-stone-200 shadow-sm">
            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-6">
              <h3 className="serif-title text-2xl font-bold text-stone-900">Team Skill / Will Matrix</h3>
              <div className="flex flex-wrap gap-4 text-xs font-semibold">
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-600"></span> STAR</span>
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-amber-600"></span> MOTIVATE / RE-ENGAGE</span>
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-blue-600"></span> DEVELOP / COACH</span>
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-rose-600"></span> PERFORMANCE MANAGEMENT</span>
              </div>
            </div>

            {/* Matrix Visual Container */}
            <div className="relative w-full aspect-[16/10] bg-white border border-stone-300 rounded-xl overflow-hidden p-6">
              {/* Center Cutoff Lines (at 3.0) */}
              <div className="absolute left-1/2 top-0 bottom-0 w-px border-r border-dashed border-stone-300"></div>
              <div className="absolute top-1/2 left-0 right-0 h-px border-b border-dashed border-stone-300"></div>

              {/* Quadrant Watermarks */}
              <span className="absolute top-4 left-6 text-[11px] font-semibold text-blue-800/40 uppercase">Develop / Coach</span>
              <span className="absolute top-4 right-6 text-[11px] font-semibold text-emerald-800/40 uppercase text-right">Star</span>
              <span className="absolute bottom-4 left-6 text-[11px] font-semibold text-rose-800/40 uppercase">Performance Mgmt</span>
              <span className="absolute bottom-4 right-6 text-[11px] font-semibold text-amber-800/40 uppercase text-right">Motivate / Re-Engage</span>

              {/* Plot Team Dots */}
              {roster.map(emp => {
                const sAvg = (CRITERIA.filter(c => c.category === "Skill").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 11);
                const wAvg = (CRITERIA.filter(c => c.category === "Will").reduce((a, c) => a + (emp.ratings[c.name] || 3), 0) / 8);

                // Map 1-5 scale to percentage (with safety margin)
                const left = ((sAvg - 1) / 4) * 85 + 7.5;
                const bottom = ((wAvg - 1) / 4) * 85 + 7.5;

                const isH_S = sAvg >= 3.0;
                const isH_W = wAvg >= 3.0;
                let dotColor = "#e11d48";
                if (isH_S && isH_W) dotColor = "#059669";
                else if (isH_S && !isH_W) dotColor = "#d97706";
                else if (!isH_S && isH_W) dotColor = "#2563eb";

                const isCurrent = emp.id === activeEmployee.id;

                return (
                  <div
                    key={emp.id}
                    onClick={() => setActiveId(emp.id)}
                    className="absolute cursor-pointer -translate-x-1/2 translate-y-1/2 flex flex-col items-center group transition"
                    style={{ left: `${left}%`, bottom: `${bottom}%` }}
                  >
                    <div className="relative flex items-center justify-center">
                      {isCurrent && (
                        <span className="absolute w-7 h-7 rounded-full border-2 border-stone-800 animate-ping opacity-40"></span>
                      )}
                      <span
                        className={`rounded-full transition ${isCurrent ? 'w-4 h-4 ring-2 ring-stone-900 shadow-md' : 'w-3 h-3 hover:scale-125'}`}
                        style={{ backgroundColor: dotColor }}
                      ></span>
                    </div>
                    <span className={`text-[11px] mt-1 whitespace-nowrap px-1.5 py-0.5 rounded ${isCurrent ? 'font-bold text-stone-900 bg-stone-100 shadow-sm' : 'text-stone-600 bg-white/80'}`}>
                      {emp.name}
                    </span>
                  </div>
                );
              })}
            </div>

            <div className="flex justify-between text-xs text-stone-400 mt-2 font-mono">
              <span>Skill Average (1.0 → 5.0)</span>
              <span>Will Average (1.0 → 5.0)</span>
            </div>
          </div>

          <footer className="text-center text-xs text-stone-400 py-6">
